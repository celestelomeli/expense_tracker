name: Run Tests

# When to run this workflow
on:
  push:
    branches: [ main, master ]  # Run on push to main/master
  pull_request:
    branches: [ main, master ]  # Run on pull requests

# Jobs to run
jobs:
  test:
    runs-on: ubuntu-latest  # Use Ubuntu server
    
    # Start MySQL service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: expense_tracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      # Step 1: Get code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      # Step 4: Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P"3306" -u"root" -p"test_password" --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
      
      # Step 5: Set up database schema
      - name: Set up database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_password expense_tracker < docker/init.sql
      
      # Step 6: Run tests
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: expense_tracker
        run: |
          pytest tests/ -v
